<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lobão Podcast — jogos zerados e reviews dos três integrantes.">
  <title>Lobão Podcast | Jogos Zerados</title>
  <style>
    :root{--bg:#03090d;--bg2:#06131a;--panel:#091b23;--panel2:#0d2630;--cyan:#00d6df;--cyan2:#08aebe;--text:#eefcff;--muted:#8ea8ae;--line:rgba(0,214,223,.18);--shadow:0 22px 70px rgba(0,0,0,.45)}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(circle at 75% 0%,#073344 0,#03090d 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
    a{color:inherit;text-decoration:none}button,input{font:inherit}.container{width:min(1160px,calc(100% - 36px));margin:auto}
    header{position:sticky;top:0;z-index:20;background:rgba(3,9,13,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 0}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.04em}.brand img{width:54px;height:54px;object-fit:contain;border-radius:12px}.brand span{font-size:17px}
    .main-tabs{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.025);padding:5px;border:1px solid var(--line);border-radius:13px}.tab-link{padding:10px 13px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:850;transition:.2s}.tab-link:hover{color:var(--text);background:rgba(0,214,223,.06)}.tab-link.active{color:var(--text);background:rgba(0,214,223,.13);box-shadow:inset 0 0 0 1px rgba(0,214,223,.18)}
    .btn{border:1px solid var(--line);background:rgba(0,214,223,.08);color:var(--text);padding:11px 15px;border-radius:10px;font-weight:800;cursor:pointer}.btn:hover{background:rgba(0,214,223,.15);border-color:rgba(0,214,223,.4)}
    main{padding:62px 0 80px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:900}.section-head h1{font-size:clamp(38px,6vw,64px);margin:8px 0 10px;letter-spacing:-.05em;line-height:.95}.section-head p{color:var(--muted);margin:0;line-height:1.6}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.search{flex:1;min-width:230px;background:#06131a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;outline:none}.search:focus{border-color:var(--cyan)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(145deg,rgba(13,38,48,.9),rgba(5,16,21,.95));border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 45px rgba(0,0,0,.18);transition:.2s;overflow:hidden}.game-card{cursor:pointer}.game-card:hover{transform:translateY(-4px);border-color:rgba(0,214,223,.4)}
    .cover{height:315px;background:#071217;position:relative;overflow:hidden}.cover img{position:relative;width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.86),transparent 58%);pointer-events:none}.cover-title{position:absolute;z-index:2;left:18px;bottom:16px;max-width:86%;font-size:28px;font-weight:950;letter-spacing:-.04em;text-shadow:0 4px 18px #000}.cover-fallback{height:100%;display:flex;align-items:flex-end;width:100%;padding:18px;position:relative;z-index:1;background:linear-gradient(135deg,#071117,#0a3440)}
    .game-info{padding:19px}.game-info h2{margin:0 0 8px;font-size:20px}.meta{color:var(--muted);font-size:13px;line-height:1.6}.game-footer{display:flex;justify-content:space-between;align-items:center;margin-top:17px}.score{font-size:20px;font-weight:950;color:var(--cyan)}.episode{font-size:12px;color:var(--muted)}.empty{grid-column:1/-1;text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modal-box{width:min(900px,100%);max-height:90vh;overflow:auto;background:#061118;border:1px solid rgba(0,214,223,.28);border-radius:22px;box-shadow:var(--shadow)}.modal-top{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.modal-top h2{margin:7px 0 0}.close{background:none;border:0;color:var(--muted);font-size:28px;cursor:pointer}.modal-body{padding:24px}.rating{font-size:42px;font-weight:950;color:var(--cyan)}.review{border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px;background:rgba(255,255,255,.015)}.review-head{display:flex;justify-content:space-between;gap:15px;margin-bottom:9px}.review-head strong{font-size:16px}.review-score{font-weight:950;color:var(--cyan)}.review p{margin:0;color:#c5d5d9;line-height:1.65}
    footer{padding:40px 0 70px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}footer .footer-row{display:flex;justify-content:space-between;gap:20px}
    @media(max-width:950px){.main-tabs{order:3;width:100%;justify-content:center}.nav{flex-wrap:wrap}.cards{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.container{width:min(100% - 24px,1160px)}.main-tabs{overflow:auto;justify-content:flex-start}.tab-link{white-space:nowrap}.cards{grid-template-columns:1fr}.cover{height:290px}.section-head{align-items:flex-start;flex-direction:column}footer .footer-row{flex-direction:column}}
  </style>
</head>
<body>
<header><div class="container nav">
  <a class="brand" href="index.html"><img src="logo.png" alt="Logo Lobão Podcast"><span>LOBÃO PODCAST</span></a>
  <nav class="main-tabs">
    <a class="tab-link" href="index.html">🎮 Próximos jogos</a>
    <a class="tab-link active" href="zerados.html">🏆 Jogos zerados</a>
    <a class="tab-link" href="sobre.html">🎙️ Sobre</a>
  </nav>
  <a class="btn" href="index.html">← Voltar ao início</a>
</div></header>

<main><div class="container">
  <div class="section-head"><div><div class="eyebrow">Arquivo do clube</div><h1>Jogos zerados</h1><p>Todos os jogos que nós três já terminamos, com as notas e opiniões de cada integrante.</p></div></div>
  <div class="toolbar"><input id="search" class="search" placeholder="Buscar jogo, gênero, plataforma ou episódio..."></div>
  <div id="completed-grid" class="cards"></div>
</div></main>

<footer><div class="container footer-row"><span>© <span id="year"></span> Lobão Podcast</span><span>Jogos zerados · Três opiniões, uma mesa.</span></div></footer>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box">
  <div class="modal-top"><div><div class="eyebrow" id="modal-episode"></div><h2 id="modal-title"></h2><div class="meta" id="modal-meta"></div></div><button class="close" onclick="closeModal()" aria-label="Fechar">×</button></div>
  <div class="modal-body"><div style="display:flex;align-items:center;gap:16px"><div class="rating" id="modal-rating"></div><div class="meta">média das três notas</div></div><p id="modal-synopsis" style="color:var(--muted);line-height:1.7"></p><div id="reviews"></div></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rzgisiuxfccjkpbfqpge.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Qw4ctAqAtEQteCytcsuT1g_H8AQDovu";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let data = { completed: [], hosts: [] };

  function esc(s){
    return String(s ?? "").replace(/[&<>\"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#039;"
    }[c]));
  }
  function hostName(id){return data.hosts.find(h=>String(h.id)===String(id))?.name || id;}

  async function loadData(){
    const [gamesRes, hostsRes, reviewsRes] = await Promise.all([
      supabase.from("games").select("id,title,year,platform,genre,episode,status,synopsis,cover,average,created_at").eq("status","completed").order("created_at",{ascending:true}),
      supabase.from("hosts").select("id,name,role,initials").order("id"),
      supabase.from("reviews").select("game_id,host_id,score,review")
    ]);

    if(gamesRes.error) throw gamesRes.error;
    if(hostsRes.error) throw hostsRes.error;
    if(reviewsRes.error) throw reviewsRes.error;

    const reviewMap = new Map();
    for(const r of (reviewsRes.data || [])){
      if(!reviewMap.has(r.game_id)) reviewMap.set(r.game_id, []);
      reviewMap.get(r.game_id).push({
        hostId:r.host_id,
        score:Number(r.score) || 0,
        review:r.review || ""
      });
    }

    data.hosts = hostsRes.data || [];
    data.completed = (gamesRes.data || []).map(g => ({
      ...g,
      hosts: reviewMap.get(g.id) || []
    }));

    renderCompleted();
  }

  function renderCompleted(){
    const q=document.getElementById("search").value.toLowerCase().trim();
    const list=data.completed.filter(g=>
      [g.title,g.genre,g.platform,g.episode].join(" ").toLowerCase().includes(q)
    );

    document.getElementById("completed-grid").innerHTML=list.length ? list.map(g=>`
      <article class="card game-card" onclick="openGame('${esc(g.id)}')">
        <div class="cover">
          ${g.cover ? `<img src="${esc(g.cover)}" alt="Capa de ${esc(g.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
          <div class="cover-fallback" style="${g.cover?'display:none':''}"><div class="cover-title">${esc(g.title)}</div></div>
          ${g.cover ? `<div class="cover-title">${esc(g.title)}</div>` : ''}
        </div>
        <div class="game-info">
          <h2>${esc(g.title)}</h2>
          <div class="meta">${esc(g.year || '')} · ${esc(g.genre || '')} · ${esc(g.platform || '')}</div>
          <div class="game-footer">
            <span class="episode">${esc(g.episode || '')}</span>
            <span class="score">${Number(g.average || 0).toFixed(1)} / 5</span>
          </div>
        </div>
      </article>`).join('') : `<div class="empty">Nenhum jogo encontrado para essa busca.</div>`;
  }

  function openGame(id){
    const g=data.completed.find(x=>String(x.id)===String(id));
    if(!g)return;

    document.getElementById("modal-episode").textContent=g.episode||"";
    document.getElementById("modal-title").textContent=g.title||"";
    document.getElementById("modal-meta").textContent=`${g.year||""} · ${g.genre||""} · ${g.platform||""}`;
    document.getElementById("modal-rating").textContent=Number(g.average||0).toFixed(1) + " / 5";
    document.getElementById("modal-synopsis").textContent=g.synopsis||"";

    document.getElementById("reviews").innerHTML=(g.hosts||[]).map(r=>`
      <div class="review">
        <div class="review-head">
          <strong>${esc(hostName(r.hostId))}</strong>
          <span class="review-score">${Number(r.score||0).toFixed(1)} / 5</span>
        </div>
        <p>${esc(r.review||"")}</p>
      </div>`).join('');

    document.getElementById("modal").classList.add("open");
  }

  function closeModal(){document.getElementById("modal").classList.remove("open");}

  document.getElementById("search").addEventListener("input",renderCompleted);
  document.getElementById("year").textContent=new Date().getFullYear();
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

  loadData().catch(err=>{
    console.error(err);
    document.getElementById("completed-grid").innerHTML=`<div class="empty">Não foi possível carregar os jogos zerados.</div>`;
  });
</script>
</body></html>
