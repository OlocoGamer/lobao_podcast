<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lobão Podcast — clube do livro dos videogames.">
  <title>Lobão Podcast | Clube dos Jogos</title>
  <style>
    :root{--bg:#03090d;--panel:#091b23;--cyan:#00d6df;--text:#eefcff;--muted:#8ea8ae;--line:rgba(0,214,223,.18);--shadow:0 22px 70px rgba(0,0,0,.45)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% 0%,#073344 0,#03090d 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}a{color:inherit;text-decoration:none}.container{width:min(1160px,calc(100% - 36px));margin:auto}header{position:sticky;top:0;z-index:20;background:rgba(3,9,13,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 0}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.04em}.brand img{width:54px;height:54px;object-fit:contain;border-radius:12px}.brand span{font-size:17px}.main-tabs{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.025);padding:5px;border:1px solid var(--line);border-radius:13px}.tab-link{padding:10px 13px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:850;transition:.2s}.tab-link:hover,.tab-link.active{color:var(--text);background:rgba(0,214,223,.11)}.btn{border:1px solid var(--line);background:rgba(0,214,223,.08);color:var(--text);padding:11px 15px;border-radius:10px;font-weight:800;cursor:pointer}.btn:hover{background:rgba(0,214,223,.15);border-color:rgba(0,214,223,.4)}.hero{padding:92px 0 74px;display:grid;grid-template-columns:1.1fr .9fr;gap:55px;align-items:center}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:900}.hero h1{font-size:clamp(44px,7vw,82px);line-height:.93;margin:15px 0 22px;letter-spacing:-.055em}.hero h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 35px rgba(0,214,223,.22)}.hero p{font-size:18px;line-height:1.7;color:var(--muted);max-width:620px}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.hero-art{min-height:410px;border:1px solid var(--line);border-radius:26px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(0,214,223,.16),transparent 46%),#02070a;box-shadow:var(--shadow)}.hero-art:after{content:"";position:absolute;width:270px;height:270px;border:1px solid rgba(0,214,223,.3);border-radius:50%;box-shadow:0 0 90px rgba(0,214,223,.13),inset 0 0 60px rgba(0,214,223,.07)}.hero-art img{position:relative;z-index:2;width:78%;max-height:390px;object-fit:contain;filter:drop-shadow(0 20px 35px #000)}section{padding:64px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.section-head h2{font-size:32px;margin:5px 0 0}.section-head p{color:var(--muted);margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(145deg,rgba(13,38,48,.9),rgba(5,16,21,.95));border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 14px 45px rgba(0,0,0,.18);transition:.2s}.card:hover{transform:translateY(-3px);border-color:rgba(0,214,223,.4)}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--cyan);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.card h3{margin:17px 0 8px;font-size:20px}.meta{color:var(--muted);font-size:13px;line-height:1.6}.note{margin-top:15px;color:#c7d8dc;font-size:13px}.cards a.card{display:block}.about{background:linear-gradient(100deg,rgba(0,214,223,.08),rgba(0,214,223,.015));border-block:1px solid var(--line)}footer{padding:40px 0 70px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}footer .footer-row{display:flex;justify-content:space-between;gap:20px}.admin-link{position:fixed;right:18px;bottom:18px;z-index:30;box-shadow:var(--shadow)}.status{margin:12px 0;color:var(--muted);font-size:13px}.error{color:#ff9aac}
    @media(max-width:950px){.main-tabs{order:3;width:100%;justify-content:center}.nav{flex-wrap:wrap}.hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.container{width:min(100% - 24px,1160px)}.main-tabs{overflow:auto;justify-content:flex-start}.tab-link{white-space:nowrap}.cards{grid-template-columns:1fr}.hero{padding-top:55px}.hero-art{min-height:300px}.footer-row{flex-direction:column}}
  </style>
</head>
<body>
<header><div class="container nav">
  <a class="brand" href="index.html"><img src="logo.png" alt="Logo Lobão Podcast"><span>LOBÃO PODCAST</span></a>
  <nav class="main-tabs"><a class="tab-link active" href="index.html">🎮 Próximos jogos</a><a class="tab-link" href="zerados.html">🏆 Jogos zerados</a><a class="tab-link" href="sobre.html">🎙️ Sobre</a></nav>
</div></header>
<main>
  <div class="container hero"><div><div class="eyebrow">Clube dos jogos</div><h1>Jogamos.<br><em>Zeramos.</em><br>Debatemos.</h1><p id="hero-description">Carregando informações...</p><div class="hero-actions"><a class="btn" href="zerados.html">Ver jogos zerados ↓</a><a class="btn" href="#proximos">O que vem por aí</a></div><div id="load-status" class="status"></div></div><div class="hero-art"><img src="logo.png" alt="Lobão Podcast"></div></div>
  <section id="proximos"><div class="container"><div class="section-head"><div><div class="eyebrow">Fila do clube</div><h2>Próximos jogos</h2></div><p>O que está esperando a vez.</p></div><div id="upcoming-grid" class="cards"></div></div></section>
</main>
<footer><div class="container footer-row"><span>© <span id="year"></span> Lobão Podcast</span><span>Feito para ser simples de atualizar.</span></div></footer>
<a class="btn admin-link" href="admin.html">⚙ Painel ADM</a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="data.js"></script><script src="supabase-client.js"></script>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function fallbackData(){return JSON.parse(JSON.stringify(PODCAST_DATA));}
async function loadPublic(){
  const status=document.getElementById("load-status");
  try{
    const [{data:pod,error:pe},{data:hosts,error:he},{data:games,error:ge}]=await Promise.all([
      supabaseClient.from("podcast").select("*").limit(1),
      supabaseClient.from("hosts").select("*").order("id"),
      supabaseClient.from("games").select("*").order("created_at",{ascending:true})
    ]);
    if(pe||he||ge) throw pe||he||ge;
    const podcast=pod?.[0];
    const upcoming=(games||[]).filter(g=>g.status==="upcoming");
    document.getElementById("hero-description").textContent=podcast?.description||PODCAST_DATA.podcast.description;
    document.getElementById("upcoming-grid").innerHTML=upcoming.length?upcoming.map(g=>`<article class="card"><span class="badge">${esc(g.note||"Na fila")}</span><h3>${esc(g.title)}</h3><div class="meta">${esc(g.genre||"")} · ${esc(g.platform||"")}</div><div class="note">${esc(g.note||"")}</div></article>`).join(""):"<div class=\"card\" style=\"grid-column:1/-1\">Nenhum próximo jogo cadastrado.</div>";
    status.textContent="Conteúdo carregado do banco online.";
  }catch(err){
    console.error(err); const d=fallbackData(); document.getElementById("hero-description").textContent=d.podcast.description; const upcoming=d.upcoming||[]; document.getElementById("upcoming-grid").innerHTML=upcoming.map(g=>`<article class="card"><span class="badge">${esc(g.status)}</span><h3>${esc(g.title)}</h3><div class="meta">${esc(g.genre)} · ${esc(g.platform)}</div><div class="note">${esc(g.note)}</div></article>`).join(""); status.innerHTML='<span class="error">Banco indisponível. Exibindo conteúdo local de emergência.</span>';
  }
}
document.getElementById("year").textContent=new Date().getFullYear();loadPublic();
</script>
</body></html>
